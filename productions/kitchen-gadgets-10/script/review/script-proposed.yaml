  narration: 'Number eight is the Microplane Premium Classic zester. If you''ve ever zested a lemon on
    a box grater, you know the bitter white pith comes along for the ride. This long, narrow grater has
    very sharp stainless steel teeth that lift just the zest, and they turn hard cheese like parmesan
    into light, fluffy shreds. Ginger, garlic and nutmeg work too. Buyers mostly praise how sharp it is
    and how easy it is to clean. The trade-offs: it costs more than a basic grater, and that blade demands
    care at the sink.'
