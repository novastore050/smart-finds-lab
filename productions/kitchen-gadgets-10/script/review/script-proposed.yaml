- id: short1
  product: egg-cooker
  use_scenes:
  - s12
  hook: Stop babysitting boiling eggs
  title: This Egg Cooker Shuts Itself Off
  narration: Stop babysitting a pot of boiling eggs. The Dash Rapid Egg Cooker does the watching for you.
    Add water with the measuring cup, set in up to six eggs, press one button, and it shuts itself off
    when they're done, soft, medium or hard. Buyers praise the automatic shut-off and quick cleanup. Just
    know the buzzer is loud, and your perfect doneness takes a little trial and error. It's number one
    in our full list of kitchen gadgets that actually make life easier.
- id: short2
  product: food-storage
  use_scenes:
  - s11
  hook: Leftover containers that don't leak
  title: Leak-Proof Containers a Test Kitchen Picked
  narration: 'If soup has ever leaked all over your lunch bag, this is for you. Rubbermaid Brilliance
    containers seal with airtight, latching lids, and in one reviewer''s leak test, no water escaped when
    they were shaken or submerged. America''s Test Kitchen says the Brilliance line won its plastic container
    testing. The weak spot is the lids: some owners report cracked lids or broken latches. See the full
    top ten on the channel.'
- id: short3
  product: instant-thermometer
  use_scenes:
  - s10
  hook: Stop cutting chicken open
  title: The Thermometer That Ends Guesswork
  narration: Stop cutting your chicken open to see if it's done. An instant-read thermometer tells you
    instead. The TP19H flips out a probe, and according to its manual, the screen shows a reading in about
    three to four seconds. One reviewer called it the best performance for the money among the thermometers
    they tried. Buyer feedback on long-term accuracy is mixed, so check it in ice water now and then.
    Full list on the channel.
