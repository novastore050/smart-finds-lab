  narration: Number three. Cutting into chicken to check it lets the juices run out, and guessing can
    leave it overcooked or undercooked. The TP19H instant-read thermometer, sold under the TempPro name,
    formerly ThermoPro, fixes that. Flip out the probe, and according to its manual, the backlit screen
    shows a reading in about three to four seconds. It's water resistant and has a magnet on the back.
    One reviewer called it the best performance for the money among the thermometers they tried. On the
