  hook: Stop cutting chicken open
  title: The Thermometer That Ends Guesswork
  narration: 'Stop cutting your chicken open to see if it''s done. Every cut lets the juices run out.
    An instant-read thermometer answers the question without the knife. The TP19H flips out a probe, and
    according to its manual, the backlit screen shows a reading in about three to four seconds. It''s
    water resistant, and a magnet on the back means it can stick to your fridge. The Grilling Dad''s review
    calls it a strong performer for the money. One catch: buyer feedback on long-term accuracy is mixed,
    so check it in ice water now and then. We didn''t test it ourselves; this comes from the manual and
    published reviews. Subscribe for more research-based kitchen finds.'
