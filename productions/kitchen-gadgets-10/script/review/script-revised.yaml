- id: s05
  role: product
  product: zester
  rank: 8
  basis: research_based
  narration: 'Number eight is the Microplane Premium Classic zester. Zest a lemon on a box grater, and
    the bitter white pith tends to come along for the ride. This long, narrow grater has very sharp stainless
    steel teeth that take just the zest, and they turn hard cheese like parmesan into light, fluffy shreds.
    Ginger, garlic and nutmeg work too, and Microplane says it comes with a reusable protective cover.
    Buyers mostly praise how sharp it is and how easy it is to clean. The trade-offs: it costs more than
    a basic grater, and that blade demands care at the sink.'
