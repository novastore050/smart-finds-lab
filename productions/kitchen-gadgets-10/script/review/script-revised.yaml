  title: 'Leak-Proof Containers: What to Check'
  narration: 'If soup has ever leaked all over your lunch bag, listen up. Rubbermaid Brilliance containers
    are sold as leak-proof, with airtight lids that latch down and clear walls, so you can see what''s
    inside. But here''s what we can''t tell you: we found no independent test of this exact three-container
    set, so for now, leak-proof is the maker''s promise. Our tip for any container sold as leak-proof:
    read recent reviews of the exact set, and look for complaints about cracked lids or broken latches.
