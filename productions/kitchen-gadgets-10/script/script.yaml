  hook: Bitter lemon zest? Blame your grater
  title: Why Your Lemon Zest Tastes Bitter
  narration: 'If your lemon zest tastes bitter, your grater might be the problem. A box grater digs into
    the white pith under the peel, and that''s where the bitterness lives. The Microplane Premium Classic
    has a long, narrow blade with sharp, photo-etched teeth that shave off just the bright outer zest.
    It also turns parmesan into fluffy shreds and handles ginger and garlic. The honest catch: that blade
    needs care when you wash it, so use the protective cover Microplane says comes with it. It also costs
    more than a basic grater. We didn''t test it ourselves; this is from Microplane''s specs and buyer
