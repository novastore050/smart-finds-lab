- id: s11
  role: product
  product: instant-thermometer
  rank: 2
  basis: research_based
  narration: 'Number two. Cutting into chicken to check it can let some of the juices escape, and guessing
    can leave it overcooked or undercooked. The TP19H instant-read thermometer, sold under the TempPro
    name, formerly ThermoPro, fixes that. Flip out the probe, and according to its manual, the backlit
    screen shows a reading in about three to four seconds. It''s water resistant and has a magnet on the
