- id: s05
  role: product
  product: zester
  rank: 8
  basis: research_based
  narration: >-
    Number eight: the Microplane Premium Classic zester. A box grater is clumsy for small jobs, and zesting a lemon
    usually drags the bitter white pith along with it. This long, narrow grater has very sharp stainless steel teeth
    that take just the zest, and they turn hard cheese like parmesan into light, fluffy shreds. It also handles
    ginger, garlic and nutmeg, and it comes with a protective cover. Buyers mostly praise how sharp it is and how
    easy it is to clean. The trade-offs: it costs more than a basic grater, and that blade deserves respect when you
    wash it. Of course, once you've cooked, there's the cleanup.
  on_screen:
    badge: '#8'
    lower_third: Microplane Premium Zester
    lower_third_sub: 'Best for: zest, parmesan, ginger'
    callout: Zest without the bitter pith
