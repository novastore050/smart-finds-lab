  rank: 5
  basis: research_based
  narration: >-
    Number five: the Fullstar vegetable chopper. Dicing onions and peppers by hand is slow, uneven, and yes, it makes
    you cry. Here you set the vegetable on a stainless steel grid, press the lid down, and even pieces drop straight
    into the container underneath. The blades are interchangeable, and the container is dishwasher safe. Reviewers
    say it makes vegetable prep much faster, and in one lab test it didn't slip while chopping. Be ready for two
    things, though: the grid has little crevices that take careful cleaning, and hard or large vegetables can need
    real force. For meal preppers, it saves a lot of knife work. And if salad is on the menu, number four fixes the
    soggy part.
