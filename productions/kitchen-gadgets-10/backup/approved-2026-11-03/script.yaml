  product: milk-frother
  rank: 6
  basis: research_based
  narration: >-
    Number six: the PowerLix handheld milk frother. Coffee-shop lattes add up, and milk warmed in the microwave
    just sits there, flat. This little battery-powered whisk spins milk into foam in roughly fifteen to twenty
    seconds, and it comes with a stainless steel stand. It works for lattes, matcha and hot chocolate. Roundup
    reviewers call it easy to use and durable. The downsides: it's loud, and it runs on two double-A batteries that
    aren't included and will need replacing. If you like cafe-style drinks at home, it's an easy way to get there.
    Back to prep work, because this next one makes onions a lot less painful.
  on_screen:
