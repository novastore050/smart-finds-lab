- id: s10
  role: product
  product: instant-thermometer
  rank: 3
  basis: research_based
  narration: >-
    Number three: the TP19H instant-read thermometer, sold under the TempPro name, though you may know the brand as
    ThermoPro. Cutting into chicken to see if it's done lets the juices escape, and guessing is how food ends up
    overcooked or undercooked. Flip out the probe, insert it, and the large backlit screen shows the temperature in
    about three to four seconds, according to its manual. It's water resistant, and a magnet on the back keeps it
    handy. One reviewer called it the best performance for the money among the thermometers they tried. But it's
    slower than premium models, and buyer feedback on long-term accuracy is mixed, so check it in ice water now and
    then. Number two solves a problem you've probably had in your lunch bag.
  on_screen:
    badge: '#3'
    lower_third: TP19H Instant-Read Thermometer
    lower_third_sub: 'Best for: meat, fish, baking'
