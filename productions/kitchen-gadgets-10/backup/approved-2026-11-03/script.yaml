- id: s12
  role: product
  product: egg-cooker
  rank: 1
  basis: research_based
  narration: >-
    And number one: the Dash Rapid Egg Cooker. Boiling eggs on the stove means watching the pot, guessing the timing,
    and hoping you got it right. This one is simple. Add water with the included measuring cup, set in up to six eggs,
    press the button, and it shuts itself off when they're done, soft, medium or hard. Buyers praise the automatic
    shut-off and how quickly it cleans up, and Reviewed, which
    tried the larger Deluxe version, found it works very well. It isn't perfect: the buzzer is loud, six eggs at a
    time can be limiting for big families, and your ideal doneness may take some trial and error. For busy mornings
    and meal prep, it's the gadget on this list most likely to change your routine.
  on_screen:
    badge: '#1'
    lower_third: Dash Rapid Egg Cooker
    lower_third_sub: 'Best for: busy mornings, meal prep'
