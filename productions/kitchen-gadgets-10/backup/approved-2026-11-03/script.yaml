- id: s03
  role: product
  product: lemon-squeezer
  rank: 10
  basis: research_based
  narration: >-
    Number ten: the Zulay two-in-one lemon squeezer. Squeezing citrus by hand is messy. Seeds end up in your food,
    and a lot of juice stays in the fruit. This hinged metal press has two bowl sizes, one for lemons and one for
    limes, and the seeds stay behind in the bowl. Buyers often mention how sturdy it feels and how easily it rinses
    clean. The catch? It isn't built for big oranges, small seed bits can slip through with key limes, and one buyer
    reported the paint chipping after a few months. If you cook with lemon or make drinks at home, it earns its
    drawer space. And speaking of jobs that take longer than they should...
  on_screen:
    badge: '#10'
    lower_third: Zulay 2-in-1 Lemon Squeezer
    lower_third_sub: 'Best for: lemonade, cooking, cocktails'
    callout: Seeds stay in the bowl
