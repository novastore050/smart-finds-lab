- id: s06
  role: product
  product: dish-brush
  rank: 7
  basis: research_based
  narration: >-
    Number seven: the OXO Good Grips soap-dispensing dish brush. Sponges get smelly fast, and scrubbing a greasy
    pan usually means your hands sit in hot, soapy water. This brush keeps dish soap in the handle. Press the button
    and it flows straight to the bristles. There's a scraper on the back for baked-on bits, and the bristles are
    safe for nonstick pans. Apartment Therapy's editors say it makes doing the dishes easier. The most common
    complaint is that the soap can leak or come out unevenly, and replacement heads are an ongoing cost. For
    everyday dishes, though, it's a simple upgrade. Now, something for your mornings.
  on_screen:
