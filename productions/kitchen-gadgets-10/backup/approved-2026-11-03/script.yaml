  rank: 4
  basis: research_based
  narration: >-
    Number four: the OXO Good Grips salad spinner. Wet lettuce is the reason so many salads end up soggy, and patting
    leaves dry with paper towels takes forever. Here you press the pump on top with one hand, the basket spins the
    water off, and a brake button stops it when you're done. The basket doubles as a colander, a non-skid base keeps
    it steady, and the parts are dishwasher safe. Reviewers like how easy it is to use and how much it holds. The
    honest downside is size: it's about ten inches across, so it takes real cabinet space, and some reviewers find
    it less sturdy than pricier spinners. Next, a gadget that's less about taste and more about safety.
