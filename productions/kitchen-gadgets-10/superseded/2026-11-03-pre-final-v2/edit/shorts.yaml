- output: kitchen-gadgets-10-short-3
  title: The Thermometer That Ends Guesswork
  hook: Stop cutting into your chicken to check it
  scenes:
  - id: s10
    narration: 'Number three: the TP19H instant-read thermometer, sold under the TempPro name, though
      you may know the brand as ThermoPro. Cutting into chicken to see if it''s done lets the juices escape,
      and guessing is how food ends up overcooked or undercooked. Flip out the probe, insert it, and the
      large backlit screen shows the temperature in about three to four seconds, according to its manual.
      It''s water resistant, and a magnet on the back keeps it handy. One reviewer called it the best
      performance for the money among the thermometers they tried. But it''s slower than premium models,
      and buyer feedback on long-term accuracy is mixed, so check it in ice water now and then. Number
      two solves a problem you''ve probably had in your lunch bag.'
