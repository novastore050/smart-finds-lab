- output: kitchen-gadgets-10-short-2
  title: Leak-Proof Containers a Test Kitchen Picked
  hook: Leftover containers that actually don't leak
  scenes:
  - id: s11
    narration: 'Number two: Rubbermaid Brilliance leak-proof food storage containers. Most leftover containers
      leak in your bag, stain, or lose their lids. These have airtight lids that latch on the sides, and
      the containers are clear, so you can see what''s inside at a glance. America''s Test Kitchen says
      the Brilliance line won its plastic food storage container testing, and in another reviewer''s leak
      test, no water got out when the containers were shaken or submerged. The weak spot is the lids:
      some buyers report cracked lids or broken latches, and lids aren''t sold separately. The latches
      also take two hands to open, and tomato sauce can stain them. But for meal prep and packed lunches,
      a container you can trust upside down is a real upgrade. And that brings us to number one.'
    duration: 52.5
    type: card
    title: Rubbermaid Brilliance Containers
