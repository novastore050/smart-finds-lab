# Product research. Every value has sources + date + verified flag.
# verified: true ONLY after checking the Amazon.com product page (see amazon-verification.csv).
research:
  topic: 10 Kitchen Gadgets That Actually Make Life Easier
  market: Amazon USA
  researched_on: '2026-11-03'
  revision: 4
  researcher: Claude (web search) for Smart Finds Lab
  method: Exact listings were re-checked by searching each ASIN on amazon.com through a search engine
    (title, brand, model number and any rating shown on the Amazon page). Benefits and drawbacks come
    from editorial reviews, retailer pages and Amazon review summaries, each with its source.
  scoring: 'Each shortlisted product gets 1-5 points for: Viewer usefulness (how much it helps a typical
    household), Visual storytelling (how clearly the benefit shows on camera), Product variety (how different
    it is from the rest of the list) and Evidence quality (Amazon data found on the exact listing + independent
    reviews). Highest total = #1. Ties go to evidence, then visual. Scores are editorial judgements based
    on the sourced data, not measurements.'
  changes:
  - 'OXO Garlic Press -> Rubbermaid Brilliance Leak-Proof Food Storage, 6-piece (B01JCNEJSO): different
    brand, new storage category, test-kitchen win for the line, strong leak-proof visual. Kuhn Rikon garlic
    press was considered but not recommended (unclear listing identity, no rating found, counterfeit warnings)
    - kept as a reserve.'
  - 'KitchenAid Shears: KEPT - model resolved, same-ASIN ratings 4.7-4.8★ (63-65K) on Amazon Australia/Singapore,
    most versatile tool; ranked #9.'
  - 'OXO Salad Spinner: KEPT - clear product identity (#1 Best Seller listing B00004OCKR) and strongest
    visual; Amazon.com rating still to be recorded.'
  - 'OXO Dish Brush: the actual product page B000CC91GK is ''currently unavailable'' and shows no rating;
    the 4.5★/29,629 figure (from a customer-review URL) is withdrawn. ASIN changed to the current version
    B0BK2R8TQB; only non-US ratings found (Singapore 4.5★/30,200, Canada 4.3★/3,975).'
  - 'Re-ranked; brands now: Dash, Rubbermaid, TempPro, OXO x2, Fullstar, PowerLix, Microplane, KitchenAid,
    Zulay.'
  limitations:
  - 'amazon.com could not be opened from the research environment: NO value is verified against the live
    page.'
  - Amazon values come from search-engine snapshots of Amazon pages; capture dates are unknown and may
    be stale.
  - Some Amazon ratings were shown on a sibling listing or review page of the same product - noted per
    field.
  - Several third-party sources are affiliate roundups; editorial hands-on reviews are labelled.
  - Products were not purchased or tested. The video stays research-based (no testing claims).
