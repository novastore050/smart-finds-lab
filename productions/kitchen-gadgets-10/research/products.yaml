# Product research. Every value has sources + date + verified flag.
# verified: true ONLY after checking the Amazon.com product page (see amazon-verification.csv).
research:
  topic: 10 Kitchen Gadgets That Actually Make Life Easier
  market: Amazon USA
  researched_on: '2026-11-03'
  revision: 2
  researcher: Claude (web search) for Smart Finds Lab
  method: Exact listings were re-checked by searching each ASIN on amazon.com through a search engine
    (title, brand, model number and any rating shown on the Amazon page). Benefits and drawbacks come
    from editorial reviews, retailer pages and Amazon review summaries, each with its source.
  scoring: 'Each shortlisted product gets 1-5 points for: Evidence (Amazon rating volume + independent
    reviews), Visual demo (how clearly the benefit shows on camera), Everyday benefit (how often a typical
    household would use it) and Clear problem/solution. Highest total = #1. Ties go to the stronger evidence.
    Scores are editorial judgements based on the sourced data, not measurements.'
  changes:
  - Replaced Etekcity Food Scale -> Dash Rapid Egg Cooker (new category, ≈112K Amazon ratings, hands-on
    review).
  - Replaced Amazon Basics Baking Mat -> Original Scrub Daddy (new cleaning category, tested best sponge,
    strong visual).
  - Replaced OXO Avocado Slicer -> PowerLix Milk Frother (new coffee category, foam demo, 66K Amazon ratings).
  - 'OXO Salad Spinner: ASIN corrected B077TV6BL3 (green ''4.0'' variant) -> B00004OCKR (classic 6.22
    Qt, model 32480).'
  - 'Fullstar Chopper: ASIN B0B8SQR665 (conflicting cached versions) -> B0764HS4SL (listing showing model
    TF1096C-8).'
  - 'KitchenAid Shears: ASIN B07TLNSW1S (Aqua Sky colour) -> B07PZF3QS3 (black, model KE351OHOBA on listing).'
  - Model numbers added for every product where the Amazon listing shows one.
  - 'Amazon data and third-party data are now strictly separate: Amazon fields cite only Amazon pages;
    figures that third parties *report* about Amazon moved to the third-party section.'
  - 'New ranking by transparent score; shortlist now shown in countdown order (#10 first, #1 last).'
  - 'Category mix now: prep 5, cooking 1, breakfast 1, cleaning 1, coffee 1, salad/washing 1 (was 9 prep-type
    tools).'
  limitations:
  - 'amazon.com could not be opened from the research environment: NO value is verified against the live
    page.'
  - Amazon values come from search-engine snapshots of Amazon pages; capture dates are unknown and may
    be stale.
  - Some Amazon ratings were shown on a sibling listing or review page of the same product - noted per
    field.
  - Several third-party sources are affiliate roundups; editorial hands-on reviews are labelled.
  - Products were not purchased or tested. The video stays research-based (no testing claims).
