- output: kitchen-gadgets-10-short-3
  title: Stop Guessing When Chicken Is Done
  hook: Stop cutting chicken open
  narration: 'Stop cutting your chicken open to see if it''s done. Slicing in to check can let some of
    those juices escape. The TP19H instant-read thermometer answers the question without the knife. Flip
    out the probe, and according to its manual, the backlit screen shows a reading in about three to four
    seconds. It''s water resistant, and a magnet on the back means it can live on your fridge. The Grilling
    Dad''s review calls it a strong performer for the money. One catch: buyer feedback on long-term accuracy
    is mixed, so check it in ice water now and then. We didn''t test it ourselves; this is from the manual
    and published reviews. Subscribe for more research-based kitchen finds.'
