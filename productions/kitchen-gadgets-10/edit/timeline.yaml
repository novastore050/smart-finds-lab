- id: s10
  narration: 'Number three: the OXO Good Grips salad spinner, because wet lettuce makes for a soggy salad.
    Instead of patting leaves dry with paper towels, you press the pump on top with one hand, the basket
    spins the water off, and a brake button stops it. According to the listing, the basket doubles as
    a colander, the parts are dishwasher safe, and a non-skid base keeps it steady. Reviewers like how
    easy it is and how much it holds. The trade-off is size: it''s big and takes up real cabinet space,
    and some reviewers find it less sturdy than pricier spinners. Now, from taste to food safety.'
