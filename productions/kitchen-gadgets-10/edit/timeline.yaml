- id: s12
  narration: Remember that breakfast you usually have to babysit? Here's the one-button fix. Number one
    is the Dash Rapid Egg Cooker. Instead of watching a pot, you add water with the included measuring
    cup, set in up to six eggs, and press the button. It shuts itself off when they're done, soft, medium
    or hard, depending on how much water you use. Buyers praise the automatic shut-off and quick cleanup.
    It's not perfect. Some reviewers say the buzzer is loud, and six eggs at a time can be limiting for
    a big family. Dialing in your perfect doneness also takes some trial and error. But if boiled eggs
    are part of your week, it's our pick for the gadget most likely to change your mornings.
