- id: s05
  narration: 'Number eight: KitchenAid''s all-purpose shears. Many jobs we do with a knife and a cutting
    board are quicker with scissors: snipping herbs into the pot, trimming chicken, slicing pizza, or
    opening stubborn packaging. The listing describes stainless steel blades, soft-grip handles and a
    plastic sheath that protects the blades in a drawer. Customer reviews call KitchenAid''s shears sharp,
    comfortable and good value. On the downside, they can dull sooner than pricier shears, and some owners
    report rust even though they''re listed as dishwasher safe, so hand washing is the safer bet. Then
    there''s a tool that makes a box grater feel clumsy.'
  transition: fade
  duration: 41.3
  clips:
