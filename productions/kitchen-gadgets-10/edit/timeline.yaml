- id: s07
  narration: And speaking of the sink, number six is the OXO Good Grips soap-dispensing dish brush. Instead
    of a sponge sitting in a puddle, the soap lives inside the handle. OXO says you press a button to
    send soap to the bristles, and a valve keeps it from dripping between uses. There's a scraper for
    stuck-on food, the bristles are safe for nonstick pans, and the head is replaceable. Some buyers still
    report leaks or uneven flow, though their reviews don't always say which version they had, and replacement
    heads are an extra cost. Still, it's a simple upgrade from a soggy sponge. That's the halfway mark,
    and the top five starts with your morning coffee.
