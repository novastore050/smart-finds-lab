- id: s03
  narration: 'Let''s start with leftovers. Number ten is a Rubbermaid Brilliance food storage set: three
    clear containers with airtight lids that latch down. Rubbermaid sells them as leak-proof, which is
    exactly what you want for soups and packed lunches. Here''s the limitation, and it''s why this set
    sits at number ten. We couldn''t find an independent test of this exact three-container set, so for
    now, leak-proof is Rubbermaid''s promise, not something we could confirm. If you''re tempted, read
    recent reviews of this exact set first. Next, a small tool for fresh citrus.'
  transition: fadeblack
