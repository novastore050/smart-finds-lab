- id: s08
  narration: 'Number five: the PowerLix handheld milk frother. Milk warmed in the microwave just sits
    there, flat. This little battery-powered whisk whips it into foam in under a minute, and it comes
    with a stand. Use it for lattes, matcha or hot chocolate. Review roundups call it easy to use and
    durable. Two drawbacks: it''s loud, and it needs two double-A batteries that aren''t included. Next,
    the job that makes a lot of us cry: chopping onions.'
