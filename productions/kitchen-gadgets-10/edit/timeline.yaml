- id: s04
  narration: 'Number nine is the Zulay two-in-one lemon squeezer: a hinged metal press with a small bowl
    for limes and a larger one for lemons. Squeeze the handles, the juice pours out, and the seeds stay
    in the bowl. Buyers often mention how sturdy it feels and how quickly it rinses clean. The catch:
    it isn''t made for big oranges, one buyer found tiny seed bits slipping through with key limes, and
    another reported chipped paint after a few months. If you cook with citrus, it earns its place. Now,
    a tool that can stand in for your knife.'
  transition: slideleft
  duration: 39.7
  clips:
