# TEST: one single voice-over file for the whole video (+ its .srt), instead of one voice file per scene.
# Scene lengths then come from 'duration' (or the clip lengths), not from the voice.
project:
  title: "System Test - Master Voice-over"
  output: test-master-voiceover
  format: long

audio:
  voiceover: samples/test-media/voiceover_full_placeholder.wav
  voiceover_start: 0          # seconds into the video where the voice-over begins
  music: samples/test-media/music_placeholder_generated.wav
  music_license: "Generated by the system (original, copyright-free)"

subtitles:
  mode: srt
  file: samples/test-media/voiceover_full_placeholder.srt   # timings relative to the voice-over file

intro: { enabled: false }
outro: { duration: 5 }

scenes:
  - id: a
    duration: 5.5
    source: samples/test-media/clip_a_left_object.mp4
  - id: b
    duration: 8
    clips:
      - source: samples/test-media/clip_b_with_sound.mp4
      - source: samples/test-media/image_1_square.jpg
    overlays:
      - { type: badge, text: "#2" }
  - id: c
    duration: 7
    source: samples/test-media/image_2_cutout.png
    fit: contain
    motion: zoom_out
  - id: d
    duration: 5
    source: samples/test-media/clip_c_vertical.mp4
