# TEST TIMELINE - uses the labelled placeholder files in samples/test-media/
# (create them with: python scripts/sfl.py make-test-media)
# It exercises every feature of the system. Do not publish the result.

project:
  title: "System Test - Placeholder Media"
  output: test-demo
  format: long

audio:
  music: samples/test-media/music_placeholder_generated.wav
  music_license: "Generated by the system (original, copyright-free)"

subtitles:
  mode: auto          # per-scene .srt if given, otherwise the narration text

intro:
  position: after_first_scene

outro:
  duration: 6

scenes:
  - id: hook
    voice: samples/test-media/voice_01_placeholder.wav
    narration: >
      These are the gadgets that make everyday kitchen jobs faster.
      Number one surprised a lot of buyers.
    clips:
      - source: samples/test-media/clip_a_left_object.mp4
        start: 1
        end: 4
      - source: samples/test-media/image_1_square.jpg
        motion: zoom_in
    overlays:
      - type: title
        text: "10 Kitchen Gadgets That Actually Make Life Easier"
        start: 0.3
        duration: 3.5

  - id: p02
    voice: samples/test-media/voice_02_placeholder.wav
    subtitles: samples/test-media/voice_02_placeholder.srt
    transition: slideleft
    clips:
      - source: samples/test-media/clip_b_with_sound.mp4
        clip_audio: 0.15          # keep a little of the clip's own sound
        end: 3
      - source: samples/test-media/clip_c_vertical.mp4   # vertical -> blurred background
    overlays:
      - type: badge
        text: "#2"
      - type: lower_third
        text: "Placeholder Gadget Two"
        subtitle: "Best for: testing lower thirds"
        start: 0.8
      - type: callout
        text: "Dishwasher safe"
        start: 4

  - id: p01
    voice: samples/test-media/voice_03_placeholder.wav
    narration: >
      The short clip below repeats automatically because the voice is longer than the footage.
      The cut-out photo is placed on a clean background with a slow pan.
    fill: cycle
    clips:
      - source: samples/test-media/clip_d_very_short.mp4
      - source: samples/test-media/image_2_cutout.png
        fit: contain
        motion: pan_right
        duration: 3
    overlays:
      - type: badge
        text: "#1"
      - type: lower_third
        text: "Placeholder Gadget One"
        subtitle: "Best for: testing the cycle fill"
    sfx:
      - file: assets/sound-effects/generated/ding.wav
        at: 1.0

  - id: chapter
    type: card
    title: "Quick Comparison"
    subtitle: "Card scene with a coloured background"
    background: "#123A4A"
    duration: 2.5
    transition: fadeblack

  - id: wrapup
    voice: samples/test-media/voice_04_placeholder.wav
    narration: Thanks for watching. Prices change often, so check the links for today's price.
    transition: zoomin
    clips:
      - source: samples/test-media/clip_a_left_object.mp4
        start: 4
    overlays:
      - type: cta
        text: "Links in the description"
        start: 0.5
        duration: scene
      - type: text
        text: "Free text overlay with a box"
        position: top
        box: true
