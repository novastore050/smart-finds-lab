# =====================================================================
#  10 Kitchen Gadgets That Actually Make Life Easier  -  TIMELINE
#  1. Replace every [text in brackets] with your real product info.
#  2. Put your media files at the paths below (or change the paths).
#  3. Check:  python scripts/sfl.py check config/timelines/kitchen-gadgets-10.yaml
#  4. Build:  python scripts/sfl.py build config/timelines/kitchen-gadgets-10.yaml
#
#  Honesty rule for this channel: we research products (specs, Amazon
#  reviews, comparisons). Never say "I tested" unless you really did.
#  QC warns you if the script contains testing claims.
# =====================================================================

project:
  title: "10 Kitchen Gadgets That Actually Make Life Easier"
  output: kitchen-gadgets-10
  format: long

audio:
  music: assets/music/background-kitchen.mp3
  music_license: "[Where the music is from, e.g. YouTube Audio Library - no attribution required]"
  # music_volume_db: -19     # uncomment to change the music level for this video only

subtitles:
  mode: auto          # uses each scene's .srt if you add one, otherwise the narration text

intro:
  position: after_first_scene   # hook first, then the 2.6 s brand sting

scenes:
  # ---------------------------------------------------------------- HOOK (first 5-10 s)
  - id: hook
    voice: assets/audio/kitchen-gadgets-10/00_hook.mp3
    narration: >
      [Hook. Example: Most kitchen gadgets end up in a drawer. These ten are different -
      based on thousands of customer reviews, they actually save time every day.
      And number one costs less than a takeaway lunch.]
    clips:
      - source: assets/video/kitchen-gadgets-10/hook_a.mp4
      - source: assets/video/kitchen-gadgets-10/hook_b.mp4
      - source: assets/video/kitchen-gadgets-10/hook_c.mp4
    overlays:
      - type: title
        text: "10 Kitchen Gadgets That Actually Make Life Easier"
        start: 0.4
        duration: 3.5

  # ---------------------------------------------------------------- #10
  - id: p10
    voice: assets/audio/kitchen-gadgets-10/10.mp3
    narration: >
      [Narration for product #10: what problem it solves, who it is for,
      one thing buyers like, one honest drawback.]
    clips:
      - source: assets/video/kitchen-gadgets-10/p10_a.mp4
      - source: assets/video/kitchen-gadgets-10/p10_b.mp4
      - source: assets/images/kitchen-gadgets-10/p10.jpg
    overlays:
      - type: badge
        text: "#10"
      - type: lower_third
        text: "[Product 10 name]"
        subtitle: "[Best for: ...]"
        start: 0.8
      - type: callout
        text: "[Key feature]"
        start: 5

