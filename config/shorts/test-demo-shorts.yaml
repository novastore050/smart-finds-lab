# TEST SHORTS - placeholder media only. Run: python scripts/sfl.py shorts config/shorts/test-demo-shorts.yaml

defaults:                       # applies to every short below (each short can override)
  from_timeline: config/timelines/test-demo.yaml
  audio:
    music: samples/test-media/music_placeholder_generated.wav
    music_license: "Generated by the system (original, copyright-free)"
    music_volume_db: -20

shorts:
  # 1) Re-use scenes from the long video (same clips, voice, subtitles, badges)
  - output: test-short-01-reuse
    title: "Test Short 1 - reused scenes"
    hook: "This placeholder gadget fixes a daily annoyance"
    use_scenes: [hook, p02, p01]

  # 2) A Short with its own scenes
  - output: test-short-02-custom
    title: "Test Short 2 - custom scenes"
    hook:
      text: "Auto-reframe test: the object is on the left"
      duration: 3.5
    cta: "Full list on the channel"
    scenes:
      - id: s1
        voice: samples/test-media/voice_03_placeholder.wav
        narration: The orange box is on the left side of a wide clip. Auto reframe should keep it in the frame.
        clips:
          - source: samples/test-media/clip_a_left_object.mp4
      - id: s2
        voice: samples/test-media/voice_02_placeholder.wav
        narration: Wide busy footage is shown whole on a blurred background so nothing important is cut off.
        clips:
          - source: samples/test-media/clip_b_with_sound.mp4
          - source: samples/test-media/image_1_square.jpg
            motion: zoom_out
        overlays:
          - type: callout
            text: "Easy to clean"
      - id: s3
        voice: samples/test-media/voice_01_placeholder.wav
        narration: A manual focus point also works when you know exactly where the product is.
        clips:
          - source: samples/test-media/clip_a_left_object.mp4
            fit: cover
            focus_x: 0.9          # 0 = left edge, 0.5 = centre, 1 = right edge

  # 3) Re-use a scene from a long video that has ONE master voice-over:
  #    the matching slice of the voice and subtitles is cut out automatically.
  - output: test-short-03-master-vo
    title: "Test Short 3 - slice of master voice-over"
    from_timeline: config/timelines/test-master-voiceover.yaml
    hook: "Slicing a master voice-over"
    use_scenes: [b, c]
